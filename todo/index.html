<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>To‑Do List — University Showcase</title>
  <meta name="description" content="Simple to-do list app with localStorage — add, edit, complete, delete tasks. Offline-friendly and accessible." />
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" role="main">
    <header class="app-header">
      <h1>To‑Do List</h1>
      <div class="controls">
        <button id="theme-toggle" aria-pressed="false">Toggle Dark</button>
      </div>
    </header>

    <section class="new-task">
      <form id="task-form" aria-label="Add new task">
        <input id="task-input" name="task" type="text" placeholder="Add a new task and press Enter" aria-label="Task description" required />
        <button type="submit">Add</button>
      </form>
    </section>

    <section class="filters" aria-label="Task filters">
      <div class="filter-buttons">
        <button data-filter="all" class="active">All</button>
        <button data-filter="active">Active</button>
        <button data-filter="completed">Completed</button>
      </div>
      <div class="bulk">
        <button id="clear-completed">Clear completed</button>
      </div>
    </section>

    <section class="tasks" aria-label="Tasks list">
      <ul id="task-list"></ul>
    </section>

    <footer class="app-footer">
      <div id="task-count">0 tasks</div>
    </footer>
  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
